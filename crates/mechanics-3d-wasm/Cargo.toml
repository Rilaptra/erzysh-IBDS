[package]
name = "mechanics_3d_wasm"
version = "0.5.0"
edition = "2021"
description = "High-frequency 3D Euler-Bernoulli structural mechanics, 5-support indeterminate solver, and zero-copy WebGL mesh extruder"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
