name: CI Quality Gate (Bun v1.4.4 & Rust WASM)

on:
  push:
    branches: [main, flash]
  pull_request:
    branches: [main, flash]

jobs:
  verify:
    name: Native Quality Gate Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/mechanics-3d-wasm -> target

      - name: Install wasm-bindgen CLI (v0.2.130)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130

      - name: Setup Bun v1.4.4
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install Node Dependencies
        run: bun install --frozen-lockfile

      - name: Run Native Rust Mechanics Unit Tests
        run: cargo test --manifest-path crates/mechanics-3d-wasm/Cargo.toml

      - name: Compile Native WASM from Rust Source
        run: bun run wasm:build

      - name: Verify WASM TypeScript Bindings are In Sync
        run: git diff --exit-code src/wasm/mechanics_3d_wasm.d.ts src/wasm/mechanics_3d_wasm.js

      - name: Check Formatting (bun fmt)
        run: bun fmt --check

      - name: Native TypeScript Check (bun check -b)
        run: bun check -b

      - name: Validate SNI Steel & Concrete Catalogs
        run: bun run data:validate

      - name: Run Parallel Unit Tests
        run: bun test --parallel --check

      - name: Next.js Production Build Verification
        run: bun --bun next build
