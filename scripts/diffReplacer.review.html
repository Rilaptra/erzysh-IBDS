<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>diffReplacer — Review Patch</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --green: #3fb950;
        --green-bg: rgba(63, 185, 80, 0.13);
        --red: #f85149;
        --red-bg: rgba(248, 81, 73, 0.13);
        --amber: #d29922;
        --amber-bg: rgba(210, 153, 34, 0.15);
        --blue: #58a6ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          "Segoe UI",
          sans-serif;
        padding-bottom: 80px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        padding: 12px 20px;
        background: rgba(13, 17, 23, 0.92);
        backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--border);
      }
      .brand {
        font-weight: 700;
        font-size: 16px;
      }
      .brand .zap {
        color: var(--amber);
      }
      #stats {
        color: var(--muted);
        font-size: 13px;
      }
      .actions {
        margin-left: auto;
        display: flex;
        gap: 8px;
      }
      button {
        background: #21262d;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover {
        border-color: #8b949e;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.primary {
        background: #238636;
        border-color: #2ea043;
        font-weight: 600;
      }
      button.primary:hover:not(:disabled) {
        background: #2ea043;
      }
      button.danger {
        background: transparent;
        border-color: #da3633;
        color: var(--red);
      }
      main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 18px;
        overflow: hidden;
      }
      .card.has-error {
        border-color: var(--red);
      }
      .file-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: #1c2129;
        border-bottom: 1px solid var(--border);
        flex-wrap: wrap;
      }
      .file-path {
        font-family: ui-monospace, Consolas, monospace;
        font-weight: 600;
        word-break: break-all;
      }
      .badge {
        font-size: 12px;
        padding: 1px 8px;
        border-radius: 10px;
      }
      .badge.add {
        color: var(--green);
        background: var(--green-bg);
      }
      .badge.del {
        color: var(--red);
        background: var(--red-bg);
      }
      .badge.action {
        color: var(--blue);
        background: rgba(88, 166, 255, 0.12);
      }
      .badge.fuzzy {
        color: var(--amber);
        background: var(--amber-bg);
      }
      .badge.error {
        color: var(--red);
        background: var(--red-bg);
      }
      .file-head label {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
        cursor: pointer;
      }
      .hunk {
        border-bottom: 1px solid var(--border);
      }
      .hunk:last-child {
        border-bottom: none;
      }
      .hunk-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 14px;
        background: rgba(255, 255, 255, 0.02);
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        color: var(--muted);
        flex-wrap: wrap;
      }
      .hunk-head label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        user-select: none;
      }
      .hunk-body {
        padding: 4px 0;
      }
      .dl {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12.5px;
        white-space: pre-wrap;
        word-break: break-all;
        padding: 0 14px 0 8px;
      }
      .dl .sign {
        display: inline-block;
        width: 18px;
        text-align: center;
        color: var(--muted);
      }
      .dl.add {
        background: var(--green-bg);
      }
      .dl.add .sign {
        color: var(--green);
      }
      .dl.del {
        background: var(--red-bg);
      }
      .dl.del .sign {
        color: var(--red);
      }
      .dl.ctx {
        color: var(--muted);
      }
      .hunk.error {
        background: rgba(248, 81, 73, 0.05);
      }
      .hunk-msg {
        padding: 2px 14px 8px 34px;
        color: var(--red);
        font-size: 12.5px;
      }
      .result-line {
        padding: 6px 14px;
        font-family: ui-monospace, Consolas, monospace;
      }
      .result-line.ok {
        color: var(--green);
      }
      .result-line.err {
        color: var(--red);
        white-space: pre-wrap;
      }
      .center-note {
        text-align: center;
        color: var(--muted);
        padding: 60px 20px;
      }
      .done-panel {
        text-align: center;
        padding: 40px 20px;
      }
      .done-panel h2 {
        margin: 0 0 16px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="zap">⚡</span> diffReplacer
        <span style="color: var(--muted); font-weight: 400">· review patch</span>
      </div>
      <div id="stats"></div>
      <div class="actions">
        <button id="acceptAll">Accept All</button>
        <button id="rejectAll">Reject All</button>
        <button id="apply" class="primary" disabled>Apply</button>
        <button id="cancel" class="danger">Cancel</button>
      </div>
    </header>
    <main id="app"><div class="center-note">Memuat patch…</div></main>
    <script>
      (function () {
        "use strict";
        var app = document.getElementById("app");
        var applyBtn = document.getElementById("apply");
        // State Map dihapus, sekarang langsung baca dari DOM checkbox biar gak miss sinkronisasi.

        function esc(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        function refreshApplyBtn() {
          var any = false;
          document.querySelectorAll('input[type="checkbox"][data-id]').forEach(function (cb) {
            if (cb.checked) any = true;
          });
          applyBtn.disabled = !any;
          applyBtn.textContent = "Apply";
        }

        function renderFiles(data) {
          var frag = document.createDocumentFragment();
          var totalHunks = 0;
          var totalAdd = 0;
          var totalDel = 0;

          data.files.forEach(function (f) {
            var card = document.createElement("div");
            card.className = "card" + (f.status === "error" ? " has-error" : "");

            var head = document.createElement("div");
            head.className = "file-head";
            var actionBadge =
              f.action === "create"
                ? '<span class="badge action">✚ file baru</span>'
                : f.action === "delete"
                  ? '<span class="badge action">🗑 hapus</span>'
                  : "";
            head.innerHTML =
              '<span class="file-path">' +
              esc(f.path) +
              "</span>" +
              actionBadge +
              '<span class="badge add">+' +
              f.adds +
              "</span>" +
              '<span class="badge del">−' +
              f.dels +
              "</span>" +
              (f.error ? '<span class="badge error">' + esc(f.error) + "</span>" : "");
            card.appendChild(head);

            f.hunks.forEach(function (h) {
              totalHunks++;
              totalAdd += h.lines.filter(function (l) {
                return l.t === "add";
              }).length;
              totalDel += h.lines.filter(function (l) {
                return l.t === "del";
              }).length;

              var bad = h.status !== "ok";
              var wrap = document.createElement("div");
              wrap.className = "hunk" + (bad ? " error" : "");

              var hh = document.createElement("div");
              hh.className = "hunk-head";
              var labelHtml =
                '<label><input type="checkbox" data-id="' +
                esc(h.id) +
                '"' +
                (bad ? " disabled" : "") +
                " />" +
                "<span>" +
                esc(h.header) +
                "</span></label>";
              var chips = "";
              if (bad) chips += '<span class="badge error">gagal match</span>';
              else if (h.matchType && h.matchType !== "exact")
                chips += '<span class="badge fuzzy">fuzzy: ' + esc(h.matchType) + "</span>";
              hh.innerHTML = labelHtml + chips;
              wrap.appendChild(hh);

              var body = document.createElement("div");
              body.className = "hunk-body";
              var html = "";
              h.lines.forEach(function (l) {
                var sign = l.t === "add" ? "+" : l.t === "del" ? "−" : " ";
                html +=
                  '<div class="dl ' +
                  l.t +
                  '"><span class="sign">' +
                  sign +
                  "</span>" +
                  esc(l.s || " ") +
                  "</div>";
              });
              body.innerHTML = html;
              wrap.appendChild(body);

              if (h.error) {
                var msg = document.createElement("div");
                msg.className = "hunk-msg";
                msg.textContent = "⚠ " + h.error;
                wrap.appendChild(msg);
              }

              card.appendChild(wrap);
            });

            frag.appendChild(card);
          });

          document.getElementById("stats").textContent =
            data.files.length +
            " file · " +
            totalHunks +
            " blok · " +
            totalAdd +
            " tambah · " +
            totalDel +
            " hapus";

          app.innerHTML = "";
          app.appendChild(frag);
          refreshApplyBtn();
        }

        function renderDone(title, files) {
          var html =
            '<div class="done-panel"><h2>' +
            esc(title) +
            '</h2><div class="card" style="text-align:left">';
          (files || []).forEach(function (r) {
            if (r.status === "skipped") {
              html +=
                '<div class="result-line" style="color: var(--muted)">○ ' +
                esc(r.path) +
                " — dilewati</div>";
            } else if (r.status === "error") {
              html +=
                '<div class="result-line err">✗ ' +
                esc(r.path) +
                " — " +
                esc(r.error || "gagal") +
                "</div>";
              (r.ops || []).forEach(function (op) {
                if (!op.ok)
                  html +=
                    '<div class="result-line err">    [' +
                    esc(op.id) +
                    "] " +
                    esc(op.error || "") +
                    "</div>";
              });
            } else {
              var label =
                r.action === "create"
                  ? "dibuat"
                  : r.action === "delete"
                    ? "dihapus"
                    : (r.ops ? r.ops.length : 0) + " blok diterapkan";
              html += '<div class="result-line ok">✓ ' + esc(r.path) + " — " + label + "</div>";
            }
          });
          html +=
            '</div><p style="color: var(--muted)">Terminal bisa diperiksa untuk log lengkap. Klik tombol di bawah untuk menutup server.</p><button class="primary" id="closeBtn">Tutup &amp; Akhiri Server</button></div>';
          app.innerHTML = html;
          applyBtn.disabled = true;
          document.getElementById("closeBtn").addEventListener("click", function () {
            fetch("/api/close", { method: "POST" })
              .then(function () {
                closeTab();
              })
              .catch(function () {});
          });
        }

        applyBtn.addEventListener("click", function () {
          var approved = [];
          document.querySelectorAll('input[type="checkbox"][data-id]').forEach(function (cb) {
            if (cb.checked && !cb.disabled) {
              approved.push(cb.getAttribute("data-id"));
            }
          });
          applyBtn.disabled = true;
          applyBtn.textContent = "Menerapkan…";
          fetch("/api/apply", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ approved: approved }),
          })
            .then(function (r) {
              return r.json();
            })
            .then(function (res) {
              renderDone(res.ok ? "✅ Patch diterapkan" : "⚠ Sebagian patch gagal", res.results);
            })
            .catch(function (err) {
              renderDone("❌ Gagal menghubungi server: " + err, []);
            });
        });

        // Helper: usahain nutup tab otomatis + fallback kalau browser nolak window.close()
        function closeTab() {
          window.close();
          // Fallback: kalau window.close() gagal, kosongin halaman biar user tahu tab ini udah gak aktif
          document.body.innerHTML =
            '<div style="display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;color:#8b949e;font-family:system-ui;"><div><h2>✅ Selesai</h2><p>Server dihentikan. Kamu bisa menutup tab ini secara manual dan kembali ke VS Code.</p></div></div>';
        }

        document.getElementById("acceptAll").addEventListener("click", function () {
          document.querySelectorAll('input[type="checkbox"][data-id]').forEach(function (cb) {
            if (!cb.disabled) cb.checked = true;
          });
          refreshApplyBtn();
        });

        document.getElementById("rejectAll").addEventListener("click", function () {
          document.querySelectorAll('input[type="checkbox"][data-id]').forEach(function (cb) {
            cb.checked = false;
          });
          refreshApplyBtn();
        });

        document.getElementById("cancel").addEventListener("click", function () {
          fetch("/api/close", { method: "POST" })
            .then(function () {
              closeTab();
            })
            .catch(function () {});
        });

        fetch("/api/patch")
          .then(function (r) {
            return r.json();
          })
          .then(renderFiles)
          .catch(function (err) {
            app.innerHTML =
              '<div class="center-note">Gagal memuat patch: ' + esc(String(err)) + "</div>";
          });
      })();
    </script>
  </body>
</html>
