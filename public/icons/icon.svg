<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4" />

  <!-- Subtle engineering grid lines -->
  <g stroke="#334155" stroke-opacity="0.3" stroke-width="1.5">
    <line x1="96" y1="96" x2="96" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="416" y1="96" x2="416" y2="416" />
    <line x1="96" y1="96" x2="416" y2="96" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="416" x2="416" y2="416" />
  </g>

  <!-- Extruded IWF Beam Cross-Section Motif -->
  <g fill="url(#beamGrad)" filter="url(#glow)">
    <!-- Top Flange -->
    <rect x="136" y="140" width="240" height="36" rx="6" />
    <!-- Web -->
    <rect x="238" y="176" width="36" height="160" rx="3" />
    <!-- Bottom Flange -->
    <rect x="136" y="336" width="240" height="36" rx="6" />
  </g>

  <!-- Deflection Curve Overlay (Catenary / Elastic Curve) -->
  <path d="M 80 256 Q 256 320 432 256" fill="none" stroke="url(#curveGrad)" stroke-width="6" stroke-dasharray="10 6" stroke-linecap="round" />

  <!-- Pin & Roller Supports -->
  <polygon points="80,256 64,288 96,288" fill="#10B981" />
  <circle cx="432" cy="272" r="14" fill="#3B82F6" />

  <!-- Text / IBDS Acronym Monogram -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#E2E8F0" text-anchor="middle" letter-spacing="4">IBDS</text>
</svg>